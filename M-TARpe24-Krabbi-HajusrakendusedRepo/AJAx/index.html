<!DOCTYPE html>
<html lang="et">
<head>
    <script src="index.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX</title>
    </head>
    <body>
        <button type="button" onclick="loadDoc()">Request not bacon</button>
        <p id="demo"></p>

        <script>
            const defaultUrl = "https://catfact.ninja/facts";
            var nextPageUrl = defaultUrl;
            function loadDoc() 
            {
                const xhttp = new XMLHttpRequest();
                xhttp.onload = function() 
                {     
                    const data = this.responseText;
                    const response = JSON.parse(data);
                    const facts = response.data.map(item => `<li>${item.fact}</li>`);
                    nextPageUrl = response.next_page_url;
                    
                    if (nextPageUrl === null) 
                    {
                        nextPageUrl = defaultUrl;
                    }
                    let dataHtml = "<ol>"
                        for (const fact of facts) 
                        {
                            dataHtml += fact;
                        }
                        dataHtml += "</ol>";
                        document.getElementById("demo").innerHTML = dataHtml;
                };

                xhttp.open("GET", nextPageUrl);
                xhttp.send();
                 // xhttp.open("GET", "https://baconipsum.com/api/?type=all-meat", true);
            }
        </script>
    </body>
</html>
